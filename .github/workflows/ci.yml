name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: >-
          swift test --disable-sandbox
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Build release app
        run: ./scripts/build-app.sh release
